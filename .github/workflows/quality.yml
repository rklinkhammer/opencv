name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Verify exported Docker lock
        run: |
          uv export --frozen --extra dev --no-emit-project --no-hashes \
            --output-file requirements.lock
          git diff --exit-code -- requirements.lock
      - name: Compile sources
        run: uv run --frozen --extra dev python -m compileall -q src scripts tests
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Check formatting
        run: uv run --frozen --extra dev ruff format --check .
      - name: Type check
        run: uv run --frozen --extra dev mypy src
      - name: Test with coverage
        run: >-
          uv run --frozen --extra dev pytest -q --cov
          --cov-report=term-missing --cov-fail-under=75

  gstreamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build test image
        run: docker compose build tests
      - name: Run camera-free GStreamer integration tests
        run: docker compose run --rm tests pytest -q -m gstreamer

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.13"
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build
      - name: Install locked development tools
        run: uv sync --frozen --extra dev
      - name: Validate distribution metadata
        run: uv run --frozen --extra dev twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/camera-capture-wheel --python 3.13
          uv pip install --python /tmp/camera-capture-wheel/bin/python dist/*.whl
          /tmp/camera-capture-wheel/bin/camera-capture --help
          /tmp/camera-capture-wheel/bin/camera-gpio-edge --help
          /tmp/camera-capture-wheel/bin/capture-main --help

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.13"
      - name: Install locked audit tools
        run: uv sync --frozen --extra dev
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --no-hashes \
            --output-file /tmp/audit.txt
          uv run --frozen --extra dev pip-audit -r /tmp/audit.txt
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build container image
        run: docker build --tag camera-capture-app:dev .
      - name: Export container filesystem
        run: |
          docker create --name camera-capture-scan camera-capture-app:dev
          docker export --output /tmp/camera-capture.tar camera-capture-scan
          mkdir /tmp/camera-capture-root
          tar --extract --file /tmp/camera-capture.tar --directory /tmp/camera-capture-root
      - name: Scan container filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: /tmp/camera-capture-root
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
