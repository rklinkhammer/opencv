[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-capture-app"
version = "0.1.0"
description = "Capture images from a USB camera with OpenCV"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Camera Capture Contributors"},
]
keywords = ["opencv", "camera", "capture", "gstreamer", "jetson", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics :: Capture",
]
dependencies = [
    "opencv-python>=4.8.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6,<0.16",
    "twine>=5.0",
]

[project.scripts]
camera-capture = "camera_capture.cli:main"
camera-gpio-edge = "gpio_capture.cli:main"
capture-main = "parallel_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["parallel_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 30
markers = [
    "gstreamer: requires the GStreamer runtime but no camera hardware",
    "hardware: requires explicitly enabled camera or GPIO hardware",
]

[tool.mypy]
mypy_path = "typings"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
